[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protannotml"
version = "0.1.0"
description = "Machine-learning annotation of IG, TR, MH and IgSF domains with IMGT unique numbering: reference code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["immunogenetics", "IMGT", "antibody numbering", "protein language model", "multi-task learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "networkx>=3.0"]

[project.optional-dependencies]
torch = ["torch>=2.2", "transformers>=4.41"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff==0.6.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Conservative rule set (pyflakes + pycodestyle errors). Widen once ruff runs in CI.
select = ["E4", "E7", "E9", "F"]
